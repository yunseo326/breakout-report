name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pages 자체는 저장소 Settings → Pages → Source = "GitHub Actions" 로
      # 최초 1회 켜둬야 한다. 워크플로의 GITHUB_TOKEN으로는 Pages 사이트를
      # 새로 생성할 수 없다("Resource not accessible by integration").
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
